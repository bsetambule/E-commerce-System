{% extends "base/delivery_base.html" %}

{% block content %}
<h1>Couriers</h1>

<ul>
    {% for c in couriers %}
        <li>
            {{ c.email }}

            <form method="POST" action="{{ url_for('delivery_manager.assign_courier', id=delivery.id) }}">
                <input type="hidden" name="courier_id" value="{{ c.id }}">
                <button>Assign</button>
            </form>
        </li>
    {% endfor %}
</ul>

{% endblock %}
