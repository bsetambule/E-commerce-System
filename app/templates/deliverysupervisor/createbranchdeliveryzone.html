<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Supervisor Create Zone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/storemanager.css') }}">
</head>

<body>

    <!-- Flash Message Section -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}">
            <span class="flash-text">{{ message }}</span>
            <button class="flash-close" type="button">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="dash-logo">
            <img src="{{ url_for('static', filename='images/logo4.jpeg') }}" alt="SetOhil logo">
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('deliverysupervisor.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('deliverysupervisor.couriers') }}">Couriers</a>
            <a href="{{ url_for('deliverysupervisor.zones') }}" class="active">Zones</a>
            <a href="{{ url_for('deliverysupervisor.deliveries') }}">Deliveries</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
    </aside>

    <!-- TOP BAR (mobile only trigger) -->
    <header class="topbar">
        <button id="menuToggle" class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>

    <div class="overlay" id="overlay"></div>

    <!-- MAIN -->
    <main class="dash-wrapper">
        <div class="dash-container">

            <!-- PAGE HEADER -->
            <header class="review-header">
                <div>
                    <h1>Create Delivery Zone</h1>
                    <p class="sub">
                        Configure delivery settings for your branch
                    </p>
                </div>
            </header>

            <!-- FORM CARD -->
            <div class="storemanager-card">

                <form id="createbranchzoneForm" method="POST"
                    action="{{ url_for('deliverysupervisor.create_branch_delivery_zone') }}">

                    <!-- DELIVERY ZONE ASSIGNMENT -->
                    <div class="form-group">

                        <label for="delivery_zone_id">Delivery Zone</label>

                        <select name="delivery_zone_id" id="delivery_zone_id" required>

                            <option value="">Select Delivery Zone</option>

                            {% for zone in delivery_zones %}
                            <option value="{{ zone.id }}">

                                {{ zone.name }}
                                {% if zone.city %}- {{ zone.city }}{% endif %}

                            </option>
                            {% endfor %}

                        </select>

                    </div>

                    <!-- BASE FEE -->
                    <div class="form-group">

                        <label for="base_fee">Base Delivery Fee (£)</label>

                        <input type="number" step="0.01" min="0" name="base_fee" id="base_fee" required
                            placeholder="e.g. 5.00">

                    </div>

                    <!-- MIN ORDER -->
                    <div class="form-group">

                        <label for="min_order_value">Minimum Order Value (£)</label>

                        <input type="number" step="0.01" min="0" name="min_order_value" id="min_order_value" value="0">

                    </div>

                    <!-- FREE DELIVERY -->
                    <div class="form-group">

                        <label for="free_delivery_threshold">Free Delivery Threshold (£)</label>

                        <input type="number" step="0.01" min="0" name="free_delivery_threshold"
                            id="free_delivery_threshold" placeholder="Optional">

                    </div>

                    <!-- DELIVERY TIME -->
                    <div class="form-group">

                        <label for="estimated_delivery_minutes">
                            Estimated Delivery Time (Minutes)
                        </label>

                        <input type="number" min="1" name="estimated_delivery_minutes" id="estimated_delivery_minutes"
                            placeholder="e.g. 45">

                    </div>

                    <!-- MAX DISTANCE -->
                    <div class="form-group">

                        <label for="max_delivery_distance_km">
                            Maximum Delivery Distance (KM)
                        </label>

                        <input type="number" step="0.01" min="0" name="max_delivery_distance_km"
                            id="max_delivery_distance_km" placeholder="Optional">

                    </div>

                    <!-- DELIVERY OPTIONS -->
                    <div class="form-group">

                        <label>Delivery Options</label>

                        <div class="delivery-options">

                            <label class="option-card">

                                <div class="option-text">
                                    <h4>Same Day Delivery</h4>
                                    <p>Allow deliveries on the same day</p>
                                </div>

                                <input type="checkbox" name="supports_same_day_delivery" value="1" checked>

                            </label>

                            <label class="option-card">

                                <div class="option-text">
                                    <h4>Scheduled Delivery</h4>
                                    <p>Allow customers to select delivery time slots</p>
                                </div>

                                <input type="checkbox" name="supports_scheduled_delivery" value="1" checked>

                            </label>

                        </div>

                    </div>

                    <!-- NOTES -->
                    <div class="form-group">

                        <label for="notes">Notes (Internal)</label>

                        <textarea name="notes" id="notes" rows="4"
                            placeholder="Internal operational notes..."></textarea>

                    </div>

                    <!-- ACTIONS -->
                    <div class="form-actions">

                        <a href="{{ url_for('deliverysupervisor.zones') }}" class="btn outline">
                            Cancel
                        </a>

                        <button type="submit" class="btn primary">
                            Attach Zone to Branch
                        </button>

                    </div>

                </form>
            </div>

        </div>
    </main>

    <!-- CONFIRM MODAL -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-content small">
            <h3 id="confirmText"></h3>
            <div class="modal-actions">
                <button id="confirmYes" class="btn primary">Yes</button>
                <button id="confirmNo" class="btn outline">Cancel</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='scripts/storemanager.js') }}"></script>

</body>

</html>
