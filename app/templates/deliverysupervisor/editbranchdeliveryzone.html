<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Supervisor Edit Zone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/storemanager.css') }}">
</head>

<body>

    <!-- Flash Message Section -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for category, message in messages %}
        <div class="flash-message flash-{{ category }}">
            <span class="flash-text">{{ message }}</span>
            <button class="flash-close" type="button">&times;</button>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="dash-logo">
            <img src="{{ url_for('static', filename='images/logo4.jpeg') }}" alt="SetOhil logo">
        </div>

        <nav class="sidebar-nav">
            <a href="{{ url_for('deliverysupervisor.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('deliverysupervisor.couriers') }}">Couriers</a>
            <a href="{{ url_for('deliverysupervisor.zones') }}" class="active">Zones</a>
            <a href="{{ url_for('deliverysupervisor.deliveries') }}">Deliveries</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
    </aside>

    <!-- TOP BAR (mobile only trigger) -->
    <header class="topbar">
        <button id="menuToggle" class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>

    <div class="overlay" id="overlay"></div>

    <!-- MAIN -->
    <main class="dash-wrapper">
        <div class="dash-container">

            <!-- PAGE HEADER -->
            <header class="review-header">
                <div>
                    <h1>Edit Delivery Zone</h1>
                    <p class="sub">
                        Configure delivery settings for your branch
                    </p>
                </div>
            </header>

            <!-- FORM CARD -->
            <div class="storemanager-card">

                <form id="editbranchzoneForm" method="POST"
                    action="{{ url_for('deliverysupervisor.edit_branch_delivery_zone', branch_zone_id=branch_zone.id) }}">
                    <!-- DELIVERY ZONE -->
                    <div class="form-group">

                        <label for="delivery_zone_id">
                            Delivery Zone
                        </label>

                        <select name="delivery_zone_id" id="delivery_zone_id" required>

                            <option value="">
                                Select Delivery Zone
                            </option>

                            {% for zone in delivery_zones %}

                            <option value="{{ zone.id }}" {% if branch_zone.delivery_zone_id==zone.id %}selected{% endif
                                %}>

                                {{ zone.name }}
                                {% if zone.city %} - {{ zone.city }}{% endif %}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- BASE FEE -->
                    <div class="form-group">

                        <label for="base_fee">
                            Base Delivery Fee (£)
                        </label>

                        <input type="number" step="0.01" min="0" name="base_fee" id="base_fee"
                            value="{{ branch_zone.base_fee }}" required>
                    </div>

                    <!-- MIN ORDER -->
                    <div class="form-group">

                        <label for="min_order_value">
                            Minimum Order Value (£)
                        </label>

                        <input type="number" step="0.01" min="0" name="min_order_value" id="min_order_value"
                            value="{{ branch_zone.min_order_value or 0 }}">
                    </div>

                    <!-- FREE DELIVERY -->
                    <div class="form-group">

                        <label for="free_delivery_threshold">
                            Free Delivery Threshold (£)
                        </label>

                        <input type="number" step="0.01" min="0" name="free_delivery_threshold"
                            id="free_delivery_threshold" value="{{ branch_zone.free_delivery_threshold or '' }}">

                    </div>

                    <!-- DELIVERY TIME -->
                    <div class="form-group">

                        <label for="estimated_delivery_minutes">
                            Estimated Delivery Time (Minutes)
                        </label>

                        <input type="number" min="1" name="estimated_delivery_minutes" id="estimated_delivery_minutes"
                            value="{{ branch_zone.estimated_delivery_minutes or '' }}">
                    </div>

                    <!-- MAX DISTANCE -->
                    <div class="form-group">

                        <label for="max_delivery_distance_km">
                            Maximum Delivery Distance (KM)
                        </label>

                        <input type="number" step="0.01" min="0" name="max_delivery_distance_km"
                            id="max_delivery_distance_km" value="{{ branch_zone.max_delivery_distance_km or '' }}">
                    </div>

                    <!-- DELIVERY OPTIONS -->
                    <div class="form-group">

                        <label>
                            Delivery Options
                        </label>

                        <div class="delivery-options">

                            <label class="option-card">

                                <div class="option-left">

                                    <div class="option-text">
                                        <h4>Same Day Delivery</h4>
                                        <p>Deliver orders within the same day</p>
                                    </div>

                                </div>

                                <input type="checkbox" name="supports_same_day_delivery" {% if
                                    branch_zone.supports_same_day_delivery %}checked{% endif %}>
                            </label>

                            <label class="option-card">

                                <div class="option-left">



                                    <div class="option-text">
                                        <h4>Scheduled Delivery</h4>
                                        <p>Allow customers to choose delivery time</p>
                                    </div>

                                </div>

                                <input type="checkbox" name="supports_scheduled_delivery" {% if
                                    branch_zone.supports_scheduled_delivery %}checked{% endif %}>
                            </label>

                        </div>

                    </div>

                    <!-- NOTES -->
                    <div class="form-group">

                        <label for="notes">
                            Notes
                        </label>

                        <textarea name="notes" id="notes" rows="5">{{ branch_zone.notes or '' }}</textarea>
                    </div>

                    <!-- ACTIONS -->
                    <div class="form-actions">

                        <a href="{{ url_for('deliverysupervisor.zones') }}" class="btn outline">
                            Cancel
                        </a>

                        <button type="submit" class="btn primary">
                            Update Delivery Zone
                        </button>

                    </div>

                </form>
            </div>

        </div>
    </main>

    <!-- CONFIRM MODAL -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-content small">
            <h3 id="confirmText"></h3>
            <div class="modal-actions">
                <button id="confirmYes" class="btn primary">Yes</button>
                <button id="confirmNo" class="btn outline">Cancel</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='scripts/storemanager.js') }}"></script>

</body>

</html>
