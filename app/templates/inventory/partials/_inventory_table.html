<table class="table table-bordered">

    <thead>
        <tr>
            <th>Variant ID</th>
            <th>Quantity</th>
            <th>Reserved</th>
            <th>Available</th>
            <th>Update</th>
        </tr>
    </thead>

    <tbody>
        {% for item in inventory %}

        <tr>
            <td>{{ item.variant_id }}</td>

            <td>{{ item.quantity }}</td>

            <td class="text-warning">
                {{ item.reserved_quantity }}
            </td>

            <td class="text-success">
                {{ item.quantity - item.reserved_quantity }}
            </td>

            <td>

                <form method="POST"
                      action="{{ url_for('inventory_manager.update_stock', id=item.id) }}"
                      class="d-flex">

                    <input type="number"
                           name="quantity"
                           value="{{ item.quantity }}"
                           class="form-control me-2"
                           min="0">

                    <button class="btn btn-sm btn-primary">Update</button>
                </form>

            </td>
        </tr>

        {% endfor %}
    </tbody>

</table>
