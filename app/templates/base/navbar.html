<nav>
    <a href="{{ url_for('products.product_list') }}">Products</a>

    {% if current_user.is_authenticated %}

        <a href="{{ url_for('cart.view_cart') }}">Cart</a>
        <a href="{{ url_for('orders.list_orders') }}">Orders</a>

        {% if current_user.has_role('admin') %}
            <a href="{{ url_for('admin.dashboard') }}">Admin</a>
        {% endif %}

        {% if current_user.has_role('delivery_manager') %}
            <a href="{{ url_for('delivery.dashboard') }}">Delivery</a>
        {% endif %}

        <a href="{{ url_for('auth.logout') }}">Logout</a>

    {% else %}
        <a href="{{ url_for('auth.login') }}">Login</a>
    {% endif %}
</nav>
