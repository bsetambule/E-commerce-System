<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Save 50%</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">Up to 50% off selected products</div>

<!-- HEADER -->
<header class="header">
  <div class="logo">LOOKFANTASTIC</div>
  <input class="search" placeholder="Search for a product..." />
  <div class="icons">
    <span>👤</span>
    <span>🛒</span>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <h1>Save up to 50%</h1>
  <p>Limited time offers on top brands</p>
</section>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>Refine</h3>

    <div class="filter">
      <h4>Category</h4>
      <label><input type="checkbox"> Skincare</label>
      <label><input type="checkbox"> Haircare</label>
      <label><input type="checkbox"> Makeup</label>
    </div>

    <div class="filter">
      <h4>Price</h4>
      <label><input type="checkbox"> Under £10</label>
      <label><input type="checkbox"> £10 - £30</label>
      <label><input type="checkbox"> £30+</label>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- SORT -->
    <div class="toolbar">
      <span>Showing 1–24 of 200</span>
      <select>
        <option>Sort by popularity</option>
        <option>Price low-high</option>
        <option>Price high-low</option>
      </select>
    </div>

    <!-- GRID -->
    <div class="grid">

      <!-- CARD -->
      <div class="card">
        <div class="badge">50% OFF</div>
        <img src="https://via.placeholder.com/250">
        <h3>Hydrating Serum</h3>
        <div class="rating">★★★★★</div>
        <div class="price">
          <span class="old">£40</span>
          <span class="new">£20</span>
        </div>
        <button>Quick Buy</button>
      </div>

      <div class="card">
        <div class="badge">40% OFF</div>
        <img src="https://via.placeholder.com/250">
        <h3>Hair Repair Mask</h3>
        <div class="rating">★★★★☆</div>
        <div class="price">
          <span class="old">£30</span>
          <span class="new">£18</span>
        </div>
        <button>Quick Buy</button>
      </div>

      <div class="card">
        <div class="badge">30% OFF</div>
        <img src="https://via.placeholder.com/250">
        <h3>Glow Foundation</h3>
        <div class="rating">★★★★★</div>
        <div class="price">
          <span class="old">£25</span>
          <span class="new">£17.50</span>
        </div>
        <button>Quick Buy</button>
      </div>

    </div>

  </main>
</div>

</body>
</html>
